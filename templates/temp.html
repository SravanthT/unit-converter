{% extends "base.html" %}

{% block title %}Temperature Converter{% endblock %}

{% block content %}
<h2>Temperature Converter</h2>
<form method="POST" target="_self">
    <div class="form-group">
        <label for="value">Value:</label>
        <input type="number" step="any" name="value" id="value" value="{{ value if value != 0.0 else '' }}" placeholder="Enter numeric temperature" required>
    </div>

    <div class="form-group">
        <label for="from_unit">Convert From:</label>
        <select name="from_unit" id="from_unit">
            {% for unit in units %}
                <option value="{{ unit }}" {% if unit == from_unit %}selected{% endif %}>{{ unit }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="to_unit">Convert To:</label>
        <select name="to_unit" id="to_unit">
            {% for unit in units %}
                <option value="{{ unit }}" {% if unit == to_unit %}selected{% endif %}>{{ unit }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Convert Value</button>
</form>

{% if result is not none %}
    <div class="result-box">
        <h3>Result: {{ value }}° {{ from_unit }} = <strong>{{ result }}° {{ to_unit }}</strong></h3>
    </div>
{% endif %}
{% endblock %}

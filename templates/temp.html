<!DOCTYPE html>
<html>
<head>
    <title>Temperature Converter</title>
</head>
<body>
    <nav>
        <a href="/length">Length</a> | <a href="/weight">Weight</a> | <a href="/temperature">Temperature</a>
    </nav>
    <h2>Temperature Converter</h2>
    <form method="POST" target="_self">
        <input type="number" step="any" name="value" placeholder="Enter value" required>
        <select name="from_unit">
            {% for unit in units %}<option value="{{ unit }}">{{ unit }}</option>{% endfor %}
        </select>
        to
        <select name="to_unit">
            {% for unit in units %}<option value="{{ unit }}">{{ unit }}</option>{% endfor %}
        </select>
        <button type="submit">Convert</button>
    </form>

    {% if result is not none %}
        <h3>Converted Value: {{ result }}</h3>
    {% endif %}
</body>
</html>

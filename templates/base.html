<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Unit Converter{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        nav { background: #f4f4f4; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #007BFF; }
        form { background: #fafafa; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; background: #e2f0d9; border: 1px solid #b5d5a6; color: #385723; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <a href="/length">📏 Length</a>
        <a href="/weight">⚖️ Weight</a>
        <a href="/temperature">🌡️ Temperature</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
